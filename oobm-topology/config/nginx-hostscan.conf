# OpsBrain nginx config for docker-compose.hostscan.yml.
# In host network mode Docker service DNS names are not available, so nginx
# proxies to the backend on the host loopback address.

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    location /opsbrain/ {
        alias /usr/share/nginx/html/opsbrain/;
        index index.html;
        try_files $uri $uri/ /opsbrain/index.html;
    }

    location = /opsbrain {
        return 301 /opsbrain/;
    }

    location = / {
        return 301 /opsbrain/;
    }

    location /opsbrain/api/ {
        rewrite ^/opsbrain(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /opsbrain/healthz {
        access_log off;
        return 200 "OK\n";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
